<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:'HNCB';src:local('HelveticaNeue-CondensedBold'),local('Helvetica Neue Condensed Bold')}</style>
<style>
  html,body{margin:0;padding:0}
  .canvas{
    width:1024px;height:1024px;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.05), transparent 60%),
      linear-gradient(180deg,#303033 0%,#1C1C1E 38%,#121214 72%,#08080A 100%);
  }
  .me{
    font-family:"HNCB","Helvetica Neue",Helvetica,sans-serif;
    font-style:italic;font-weight:700;
    font-size:630px;line-height:.72;letter-spacing:-.02em;
    color:#d6ff4b;margin:0 0 58px 6px;
    transform:translate(-44px,-61px);
  }
  .sub{
    font-family:"Helvetica Neue",Helvetica,sans-serif;
    font-weight:700;font-size:78px;line-height:1;
    letter-spacing:.44em;color:#9aa19b;
    margin-left:.44em;
    transform:translate(-2px,-40px);
  }
</style></head>
<body>
  <div class="canvas">
    <div class="me">me</div>
    <div class="sub">FITNESS</div>
  </div>
</body></html>
